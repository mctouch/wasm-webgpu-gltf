[package]
name = "wasm-webgpu-gltf"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
wgpu = { version = "25", features = ["webgpu", "wgsl"] }
bytemuck = { version = "1.14", features = ["derive"] }
serde_json = "1"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlCanvasElement", "Navigator", "Performance",
] }

[profile.release]
opt-level = "s"
lto = true
